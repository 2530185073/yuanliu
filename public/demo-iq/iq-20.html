<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑自行车</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eff5ee;
      color: #284c49;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main {
      width: min(960px, 94vw);
      padding: 28px 0;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 0 8px 18px;
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #72918a;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 4vw, 38px);
      letter-spacing: -1px;
    }

    .badge {
      flex-shrink: 0;
      padding: 8px 12px;
      border: 1px solid #cadbd0;
      border-radius: 30px;
      font-size: 12px;
    }

    .scene {
      overflow: hidden;
      border-radius: 24px;
      background: #dff0ea;
      box-shadow: 0 22px 60px #254b4415;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 18px 8px 0;
      font-size: 13px;
      color: #6f8880;
    }

    button {
      padding: 10px 20px;
      border: 0;
      border-radius: 24px;
      background: #285950;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    button:hover { background: #357164; }
    button:focus-visible { outline: 3px solid #ecaa55; outline-offset: 4px; }

    .outline {
      stroke: #304f50;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .spokes {
      stroke: #91aaa7;
      stroke-width: 2;
    }

    .leg {
      fill: none;
      stroke-width: 12;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">A LITTLE SEASIDE RIDE</p>
        <h1>鹈鹕的海边骑行</h1>
      </div>
      <span class="badge">SVG · 2D 动画</span>
    </header>

    <div class="scene">
      <svg viewBox="0 0 960 620" role="img"
           aria-labelledby="sceneTitle sceneDescription">
        <title id="sceneTitle">一只骑着自行车的鹈鹕</title>
        <desc id="sceneDescription">
          白色鹈鹕戴着绿色小帽，围着橙色围巾，沿着海边小路踩动蓝绿色自行车。
        </desc>

        <defs>
          <linearGradient id="sky" x2="0" y2="1">
            <stop stop-color="#dceee8"/>
            <stop offset="1" stop-color="#f4f5df"/>
          </linearGradient>

          <linearGradient id="sea" x2="0" y2="1">
            <stop stop-color="#a9d7cb"/>
            <stop offset="1" stop-color="#c8e5d3"/>
          </linearGradient>

          <g id="cloud" fill="#fffdf1" opacity=".82">
            <ellipse cx="0" cy="0" rx="51" ry="14"/>
            <ellipse cx="-20" cy="-11" rx="25" ry="20"/>
            <ellipse cx="12" cy="-17" rx="29" ry="25"/>
            <ellipse cx="39" cy="-5" rx="23" ry="16"/>
          </g>

          <g id="wheel">
            <circle r="77" fill="#f6f8ed" fill-opacity=".28"
                    stroke="#304f50" stroke-width="12"/>
            <circle r="69" fill="none" stroke="#f8edd6" stroke-width="3"/>
            <g class="spokes">
              <path d="M-67 0H67 M0-67V67"/>
              <path d="M-47-47L47 47 M-47 47L47-47"/>
              <path d="M-62-26L62 26 M-26-62L26 62"/>
              <path d="M-62 26L62-26 M-26 62L26-62"/>
            </g>
            <circle r="9" fill="#e9b467" stroke="#304f50" stroke-width="3"/>
          </g>

          <g id="roadMarks" stroke="#fff8e2" stroke-width="5"
             stroke-linecap="round">
            <path d="M0 0h65 M180 0h65 M360 0h65 M540 0h65
                     M720 0h65 M900 0h65 M1080 0h65"/>
          </g>

          <g id="grass" fill="none" stroke="#739b7e"
             stroke-width="3" stroke-linecap="round">
            <path d="M0 0q-3-13-10-18 M0 0q2-20 10-27 M0 0q12-11 18-10"/>
          </g>
        </defs>

        <!-- 海边风景 -->
        <path fill="url(#sky)" d="M0 0h960v620H0z"/>
        <circle cx="769" cy="114" r="48" fill="#f7d88e"/>
        <circle cx="769" cy="114" r="64" fill="#f7d88e" opacity=".12"/>

        <g id="cloudA"><use href="#cloud" x="180" y="108"/></g>
        <g id="cloudB"><use href="#cloud" x="520" y="70" transform="scale(.8)"/></g>
        <g id="cloudC"><use href="#cloud" x="930" y="167"/></g>

        <path d="M0 300Q135 266 264 300T535 298T800 285T1080 295V414H0Z"
              fill="#bdd9c4"/>
        <path d="M0 322Q240 310 480 324T960 315V424H0Z" fill="url(#sea)"/>

        <g fill="none" stroke="#eef8e7" stroke-width="3" opacity=".65">
          <path d="M40 351h90m38 0h36m474-13h95m42 0h24"/>
          <path d="M290 380h85m27 0h42m334-7h120"/>
        </g>

        <path d="M0 405Q230 381 467 405T960 396V620H0Z" fill="#d7dfb0"/>
        <path d="M0 473Q400 461 960 480V589Q490 569 0 584Z" fill="#e3cfaa"/>
        <path d="M0 476Q430 463 960 483" fill="none"
              stroke="#f5e6c3" stroke-width="5"/>

        <g id="road"><use href="#roadMarks" y="549"/></g>
        <g id="plants">
          <use href="#grass" x="140" y="451"/>
          <use href="#grass" x="600" y="442"/>
          <use href="#grass" x="1000" y="452"/>
        </g>

        <ellipse id="shadow" cx="480" cy="511" rx="222" ry="14"
                 fill="#667960" opacity=".15"/>

        <!-- 自行车 -->
        <g>
          <g transform="translate(323 425)">
            <g id="rearWheel"><use href="#wheel"/></g>
          </g>
          <g transform="translate(639 425)">
            <g id="frontWheel"><use href="#wheel"/></g>
          </g>

          <!-- 远侧腿 -->
          <path id="farLeg" class="leg" stroke="#bc8449"/>
          <g id="farFoot">
            <path d="M-12-3Q1-8 22 3L28 9H-12Z"
                  fill="#ce9451" stroke="#304f50" stroke-width="3"/>
            <path d="M-14 12H27" stroke="#304f50"
                  stroke-width="6" stroke-linecap="round"/>
          </g>

          <!-- 车架和前叉 -->
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M323 425L399 309L460 425H323L580 309H399
                     M460 425L580 309L639 425"
                  stroke="#304f50" stroke-width="13"/>
            <path d="M323 425L399 309L460 425H323L580 309H399
                     M460 425L580 309L639 425"
                  stroke="#46968e" stroke-width="8"/>
            <path d="M399 309L389 281 M580 309L568 270
                     Q563 254 580 250L609 250"
                  stroke="#304f50" stroke-width="8"/>
            <path d="M596 250h22" stroke="#cf8953" stroke-width="10"/>
          </g>

          <path d="M369 276Q388 268 415 276L422 284H365Z"
                fill="#865d46" class="outline"/>

          <path d="M325 419L457 407Q480 407 480 425
                   Q480 443 457 443L325 432Z"
                fill="none" stroke="#607a70" stroke-width="3"/>
          <circle cx="460" cy="425" r="23"
                  fill="#e8e7cc" stroke="#304f50" stroke-width="4"/>
          <circle cx="460" cy="425" r="15"
                  fill="none" stroke="#91aaa0" stroke-width="3"/>
          <path id="crank" fill="none" stroke="#304f50"
                stroke-width="7" stroke-linecap="round"/>
          <circle cx="460" cy="425" r="5" fill="#304f50"/>
        </g>

        <!-- 鹈鹕身体 -->
        <g id="pelican">
          <!-- 围巾飘带 -->
          <path id="scarfTail"
                d="M470 212Q436 203 401 223L367 212L376 237Q421 247 477 228Z"
                fill="#e68a59" class="outline"/>

          <!-- 尾羽 -->
          <path d="M357 254L309 230L321 260L298 254
                   Q319 290 369 289Z"
                fill="#ecf1e6" class="outline"/>

          <!-- 身体、长脖子与头 -->
          <path d="M355 247
                   C375 224 427 230 449 215
                   C461 204 463 181 465 159
                   C467 127 487 110 510 114
                   C539 116 554 140 548 166
                   C544 188 524 201 518 216
                   C510 236 520 260 506 282
                   C485 312 425 321 384 305
                   C357 294 342 269 355 247Z"
                fill="#fffdf0" class="outline"/>

          <!-- 肚子阴影 -->
          <path d="M357 271Q399 317 482 289
                   Q463 315 408 307Q371 301 357 271Z"
                fill="#dce7da"/>

          <!-- 翅膀握向车把 -->
          <path d="M398 242
                   Q434 226 470 252
                   Q515 270 571 250
                   Q583 247 587 255
                   Q558 283 509 287
                   Q455 288 420 273
                   Q402 268 398 242Z"
                fill="#e4ece1" class="outline"/>
          <path d="M421 250Q454 271 494 272"
                fill="none" stroke="#bdcfc5" stroke-width="3"
                stroke-linecap="round"/>

          <!-- 下喙及宽大的喉囊 -->
          <path d="M526 171L666 177
                   Q621 229 565 221
                   Q532 214 526 171Z"
                fill="#efb963" class="outline"/>
          <path d="M544 184Q560 214 595 211"
                fill="none" stroke="#d99c52" stroke-width="3"
                stroke-linecap="round"/>

          <!-- 长长的上喙 -->
          <path d="M529 154Q592 148 680 171
                   Q688 173 680 180
                   L530 175Z"
                fill="#f7ce75" class="outline"/>
          <path d="M542 166L661 173" fill="none"
                stroke="#e5ab57" stroke-width="2"/>

          <!-- 眼睛 -->
          <circle cx="513" cy="145" r="11" fill="#e5ece0"/>
          <circle cx="516" cy="145" r="5" fill="#304f50"/>
          <circle cx="518" cy="143" r="1.6" fill="white"/>
          <path d="M502 132Q510 127 518 131"
                fill="none" stroke="#304f50" stroke-width="3"
                stroke-linecap="round"/>

          <!-- 小帽子 -->
          <path d="M474 121Q468 98 491 95Q516 92 524 117Z"
                fill="#548e75" class="outline"/>
          <path d="M467 122Q497 114 537 123"
                fill="none" stroke="#304f50" stroke-width="6"
                stroke-linecap="round"/>
          <path d="M486 100L483 114" stroke="#8fbaa0"
                stroke-width="4" stroke-linecap="round"/>

          <!-- 围巾 -->
          <path d="M462 208Q484 220 519 207L516 226
                   Q489 237 460 226Z"
                fill="#e98e59" class="outline"/>
          <path d="M469 217L486 223" stroke="#f5be7c"
                stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- 近侧腿与脚 -->
        <path id="nearLeg" class="leg" stroke="#e1a355"/>
        <g id="nearFoot">
          <path d="M-13-4Q2-9 24 3L30 9H-13Z"
                fill="#f0ba62" stroke="#304f50" stroke-width="3"/>
          <path d="M-15 12H29" stroke="#304f50"
                stroke-width="6" stroke-linecap="round"/>
          <path d="M10 1L16 6M19 3L23 7"
                stroke="#c88a42" stroke-width="2"/>
        </g>

        <!-- 轻柔的风线 -->
        <g id="wind" fill="none" stroke="#7da699"
           stroke-width="3" stroke-linecap="round" opacity=".6">
          <path d="M254 188h48M235 204h32M265 220h24"/>
        </g>
      </svg>
    </div>

    <footer>
      <span>不赶时间，沿着海风慢慢骑。</span>
      
    </footer>
  </main>

  
</body>
</html>
