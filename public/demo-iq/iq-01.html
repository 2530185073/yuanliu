<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>鹈鹕的骑行日记</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #f4efe5;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #304f54;
  }

  .card {
    width: min(100%, 960px);
    overflow: hidden;
    border: 1px solid #fff;
    border-radius: 28px;
    background: #fffaf0;
    box-shadow: 0 24px 70px #344f5420;
  }

  header {
    padding: 30px 36px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
  }

  h1 {
    margin: 0 0 8px;
    font-size: clamp(22px, 4vw, 32px);
    letter-spacing: 2px;
  }

  p {
    margin: 0;
    color: #7a9291;
    font-size: 14px;
    letter-spacing: 1px;
  }

  .badge {
    flex-shrink: 0;
    padding: 9px 14px;
    border: 1px solid #dbe6d8;
    border-radius: 30px;
    color: #68836e;
    font-size: 12px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
  }

  footer {
    padding: 0 36px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    color: #7a9291;
    font-size: 12px;
  }

  button {
    border: 0;
    border-radius: 20px;
    padding: 10px 18px;
    background: #e5eee4;
    color: #365b4e;
    font: inherit;
    cursor: pointer;
  }

  button:hover { background: #d5e5d4; }
  button:focus-visible { outline: 3px solid #e7ac5f; }

  .spin { animation: spin 1.2s linear infinite; }
  .counter-spin { animation: counter-spin 1.2s linear infinite; }
  .rider { animation: bob .6s ease-in-out infinite; }
  .scarf { animation: flutter .6s ease-in-out infinite alternate; }
  .cloud-a { animation: drift 30s linear infinite; }
  .cloud-b { animation: drift 45s linear infinite; }
  .road { animation: road .8s linear infinite; }
  .grass { animation: grass 3s linear infinite; }
  .wind { animation: wind 1.8s ease-out infinite; }
  .wind.delay { animation-delay: .9s; }

  .leg-front { animation: pedal-front 1.2s linear infinite; }
  .leg-back { animation: pedal-back 1.2s linear infinite; }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes counter-spin {
    to { transform: rotate(-360deg); }
  }

  @keyframes bob {
    50% { transform: translateY(3px) rotate(.5deg); }
  }

  @keyframes flutter {
    from { transform: rotate(-5deg); }
    to { transform: rotate(6deg); }
  }

  @keyframes drift {
    from { transform: translateX(980px); }
    to { transform: translateX(-250px); }
  }

  @keyframes road {
    to { transform: translateX(-120px); }
  }

  @keyframes grass {
    to { transform: translateX(-300px); }
  }

  @keyframes wind {
    0% { opacity: 0; transform: translateX(35px); }
    25% { opacity: .7; }
    100% { opacity: 0; transform: translateX(-90px); }
  }

  @keyframes pedal-front {
    0%, 100% {
      d: path("M 405 251 Q 400 309 450 377");
    }
    25% {
      d: path("M 405 251 Q 377 318 425 402");
    }
    50% {
      d: path("M 405 251 Q 365 304 400 377");
    }
    75% {
      d: path("M 405 251 Q 400 293 425 352");
    }
  }

  @keyframes pedal-back {
    0%, 100% {
      d: path("M 395 251 Q 355 304 400 377");
    }
    25% {
      d: path("M 395 251 Q 390 293 425 352");
    }
    50% {
      d: path("M 395 251 Q 390 309 450 377");
    }
    75% {
      d: path("M 395 251 Q 367 318 425 402");
    }
  }

  .paused svg * {
    animation-play-state: paused !important;
  }

  @media (max-width: 540px) {
    body { padding: 12px; }
    header { padding: 24px 22px 0; }
    .badge { display: none; }
    footer { padding: 0 22px 22px; }
  }
</style>
</head>
<body>
<main class="card" id="card">
  <header>
    <div>
      <h1>鹈鹕的骑行日记</h1>
      <p>微风正好，慢慢骑就好。</p>
    </div>
    <span class="badge">☀ 海岸线 · 好天气</span>
  </header>

  <svg viewBox="0 0 900 520" role="img"
       aria-labelledby="scene-title scene-desc">
    <title id="scene-title">一只鹈鹕骑着自行车沿海岸前进</title>
    <desc id="scene-desc">
      鹈鹕有长长的橙色嘴巴和鼓起的喉囊，戴着绿色围巾，
      双脚不断踩踏自行车，车轮旋转，云朵和路面向后移动。
    </desc>

    <defs>
      <linearGradient id="sky" x2="0" y2="1">
        <stop stop-color="#fffaf0"/>
        <stop offset="1" stop-color="#e1f0e9"/>
      </linearGradient>

      <linearGradient id="pouch" x2=".2" y2="1">
        <stop stop-color="#ffd38b"/>
        <stop offset="1" stop-color="#efa261"/>
      </linearGradient>

      <linearGradient id="feather" x2=".8" y2="1">
        <stop stop-color="#fffef7"/>
        <stop offset="1" stop-color="#e6e5d7"/>
      </linearGradient>

      <pattern id="road-lines" width="120" height="20"
               patternUnits="userSpaceOnUse">
        <path d="M15 10 H70" stroke="#fff8e9"
              stroke-width="5" stroke-linecap="round"/>
      </pattern>

      <pattern id="grass-pattern" width="300" height="36"
               patternUnits="userSpaceOnUse">
        <path d="M35 32 l-5-9 m5 9 5-13
                 M173 30 l-5-8 m5 8 7-11
                 M260 34 l-3-7"
              fill="none" stroke="#91b59a"
              stroke-width="3" stroke-linecap="round"/>
      </pattern>

      <g id="cloud" fill="#ffffff" opacity=".85">
        <ellipse cx="70" cy="28" rx="70" ry="20"/>
        <circle cx="46" cy="15" r="24"/>
        <circle cx="85" cy="10" r="31"/>
        <circle cx="116" cy="22" r="20"/>
      </g>

      <g id="spokes" stroke="#b5c8c3" stroke-width="2">
        <path d="M-71 0H71 M0-71V71
                 M-50-50L50 50 M-50 50L50-50
                 M-66-27L66 27 M-27-66L27 66
                 M-66 27L66-27 M-27 66L27-66"/>
        <circle r="5" fill="#537174" stroke="none"/>
        <path d="M40-60 A72 72 0 0 1 60-40"
              stroke="#f6bf6f" stroke-width="5"
              stroke-linecap="round"/>
      </g>

      <g id="wheel">
        <circle r="79" fill="#fffaf0" fill-opacity=".38"
                stroke="#355359" stroke-width="10"/>
        <circle r="71" fill="none" stroke="#edf3e9" stroke-width="3"/>
        <g class="spin"><use href="#spokes"/></g>
      </g>

      <g id="shoe">
        <path d="M-11-6 Q-2-11 7-5 L20 0
                 Q24 6 15 7 H-10 Q-16 4-11-6Z"
              fill="#e9a14e" stroke="#775c3e"
              stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M-13 10H18" stroke="#355359"
              stroke-width="5" stroke-linecap="round"/>
      </g>
    </defs>

    <!-- 海边背景 -->
    <path d="M0 0H900V400H0Z" fill="url(#sky)"/>
    <circle cx="738" cy="95" r="43" fill="#f8d88c"/>
    <circle cx="738" cy="95" r="56"
            fill="none" stroke="#f8d88c" stroke-opacity=".22"
            stroke-width="12"/>

    <g transform="translate(0 75)">
      <g class="cloud-a" style="animation-delay:-19s">
        <use href="#cloud"/>
      </g>
    </g>
    <g transform="translate(0 155) scale(.7)">
      <g class="cloud-b" style="animation-delay:-9s">
        <use href="#cloud"/>
      </g>
    </g>

    <path d="M0 300 Q130 240 280 297 T580 289 T900 279
             V390H0Z" fill="#c6dfd0"/>
    <path d="M0 331 Q160 290 320 332 T630 317 T900 326
             V400H0Z" fill="#afd1bf"/>
    <path d="M0 365 Q240 346 450 365 T900 352V420H0Z"
          fill="#d6e4c4"/>

    <g transform="translate(0 376)">
      <g class="grass">
        <rect width="1200" height="36" fill="url(#grass-pattern)"/>
      </g>
    </g>

    <path d="M0 413H900V485H0Z" fill="#ded7bf"/>
    <path d="M0 413H900" stroke="#c0c9a6" stroke-width="4"/>
    <g transform="translate(0 457)">
      <g class="road">
        <rect width="1080" height="20" fill="url(#road-lines)"/>
      </g>
    </g>
    <path d="M0 485H900V520H0Z" fill="#fffaf0"/>

    <!-- 风线与落地阴影 -->
    <g fill="none" stroke="#8daea1" stroke-width="3"
       stroke-linecap="round">
      <path class="wind" d="M206 198H264 M226 214H250"/>
      <path class="wind delay" d="M645 266H694 M664 282H714"/>
    </g>
    <ellipse cx="441" cy="454" rx="225" ry="13"
             fill="#52675a" opacity=".13"/>

    <!-- 车轮 -->
    <g transform="translate(305 377)"><use href="#wheel"/></g>
    <g transform="translate(580 377)"><use href="#wheel"/></g>

    <!-- 后侧腿 -->
    <path class="leg-back"
          d="M395 251 Q355 304 400 377"
          fill="none" stroke="#bd8549" stroke-width="11"
          stroke-linecap="round"/>

    <!-- 车架 -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M305 377L385 282L425 377Z
               M385 282H540L425 377
               M540 282L580 377"
            stroke="#345a5a" stroke-width="12"/>
      <path d="M305 377L385 282L425 377Z
               M385 282H540L425 377
               M540 282L580 377"
            stroke="#70b4a5" stroke-width="7"/>

      <path d="M385 282L378 260" stroke="#537174" stroke-width="7"/>
      <path d="M359 262H403" stroke="#735b48" stroke-width="11"/>

      <path d="M540 282L532 251H555
               Q570 251 570 264"
            stroke="#537174" stroke-width="7"/>
      <path d="M552 251H562" stroke="#735b48" stroke-width="9"/>

      <!-- 链条 -->
      <path d="M305 366L425 356
               A21 21 0 0 1 425 398L305 389
               A12 12 0 0 1 305 366Z"
            stroke="#526866" stroke-width="3"/>
    </g>

    <circle cx="425" cy="377" r="25"
            fill="#eff1df" stroke="#537174" stroke-width="4"/>
    <circle cx="425" cy="377" r="15"
            fill="none" stroke="#a6b7a8" stroke-width="3"/>

    <!-- 鹈鹕上半身 -->
    <g class="rider" style="transform-origin:400px 260px">
      <!-- 尾羽 -->
      <path d="M357 225L315 211L337 242L319 240
               Q340 265 373 252Z"
            fill="#f4f3e8" stroke="#53665f" stroke-width="3"
            stroke-linejoin="round"/>

      <!-- 身体 -->
      <path d="M359 197
               Q390 173 423 190
               Q451 203 437 235
               Q423 267 382 260
               Q347 255 344 230
               Q341 211 359 197Z"
            fill="url(#feather)" stroke="#53665f" stroke-width="3"/>

      <!-- 弯曲的长脖子 -->
      <path d="M407 208
               Q414 180 429 156
               Q424 135 438 117
               Q452 102 470 112
               Q484 122 476 141
               Q462 158 459 178
               Q455 205 436 220"
            fill="url(#feather)" stroke="#53665f"
            stroke-width="3" stroke-linecap="round"/>

      <!-- 头顶羽毛 -->
      <path d="M441 116L431 102L448 109L447 96L460 110"
            fill="#fffef7" stroke="#53665f"
            stroke-width="2.5" stroke-linejoin="round"/>

      <!-- 大喉囊 -->
      <path d="M470 139L611 151
               Q572 169 529 191
               Q497 207 481 177Z"
            fill="url(#pouch)" stroke="#986d43" stroke-width="3"/>
      <path d="M489 156Q506 185 530 180"
            fill="none" stroke="#ffe3a6" stroke-width="4"
            stroke-linecap="round"/>

      <!-- 长喙 -->
      <path d="M471 129Q531 126 614 150
               Q620 153 608 157L471 146Z"
            fill="#efb353" stroke="#986d43"
            stroke-width="3" stroke-linejoin="round"/>
      <path d="M483 141L602 151"
            stroke="#cf8c3d" stroke-width="2" stroke-linecap="round"/>

      <!-- 眼睛 -->
      <circle cx="462" cy="124" r="8" fill="#fffdf4"/>
      <circle cx="465" cy="124" r="4" fill="#293f43"/>
      <circle cx="466" cy="122.5" r="1.3" fill="#fff"/>
      <path d="M454 112Q461 108 469 113"
            fill="none" stroke="#53665f" stroke-width="2.5"
            stroke-linecap="round"/>

      <!-- 围巾 -->
      <g transform="translate(440 177)">
        <g class="scarf">
          <path d="M0 0Q-33-13-66-3L-51 5L-67 14
                   Q-26 17 3 8Z"
                fill="#4e9785" stroke="#3c7567" stroke-width="2"/>
          <path d="M-14 3Q-33 0-48 4"
                fill="none" stroke="#8bc2a9" stroke-width="3"/>
        </g>
      </g>
      <path d="M429 170Q443 180 457 177L453 188
               Q438 191 424 181Z"
            fill="#5ca58e" stroke="#3c7567" stroke-width="2"/>

      <!-- 翅膀向前扶住车把 -->
      <path d="M383 209
               Q403 198 420 218
               Q442 244 482 247
               L546 248
               Q557 252 546 258
               L482 263
               Q439 265 412 247
               Q385 244 376 226"
            fill="#eeeee1" stroke="#53665f"
            stroke-width="3" stroke-linecap="round"
            stroke-linejoin="round"/>
      <path d="M389 220Q409 239 429 242
               M386 230Q397 241 407 243"
            fill="none" stroke="#c0c6b7" stroke-width="3"
            stroke-linecap="round"/>
    </g>

    <!-- 前侧腿与同步旋转的脚蹬 -->
    <path class="leg-front"
          d="M405 251 Q400 309 450 377"
          fill="none" stroke="#e9a14e" stroke-width="12"
          stroke-linecap="round"/>

    <g transform="translate(425 377)">
      <g class="spin">
        <path d="M-25 0H25" stroke="#486565"
              stroke-width="6" stroke-linecap="round"/>
        <g transform="translate(-25 0)">
          <g class="counter-spin" opacity=".85">
            <use href="#shoe"/>
          </g>
        </g>
        <g transform="translate(25 0)">
          <g class="counter-spin">
            <use href="#shoe"/>
          </g>
        </g>
      </g>
      <circle r="6" fill="#355359"/>
      <circle r="2" fill="#dce9df"/>
    </g>

    <!-- 车铃 -->
    <path d="M544 247V239" stroke="#537174" stroke-width="3"/>
    <path d="M536 241A8 8 0 0 1 552 241Z"
          fill="#f4cb73" stroke="#8b784c" stroke-width="2"/>
  </svg>

  <footer>
    <span>PELICAN CYCLING CLUB · 一路向着海风</span>
    
  </footer>
</main>


</body>
</html>
